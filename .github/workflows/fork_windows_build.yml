name: Fork Windows Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fork-windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
          submodules: true
          fetch-depth: 1

      - name: Test fork deployment helper contract
        shell: pwsh
        run: ./tools/test-deploy-fork-build-contract.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            GSM_Overlay/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            GSM_Overlay/input_server -> GSM_Overlay/input_server/target

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json', 'GSM_Overlay/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install wheel builder
        run: python -m pip install --upgrade cibuildwheel

      - name: Build Windows backend wheel
        env:
          CIBW_BUILD: cp310-*
          CIBW_ARCHS_WINDOWS: AMD64
        run: python -m cibuildwheel --output-dir electron-src/assets/python

      - name: Smoke test backend wheel
        run: node scripts/smoke-test-wheel.mjs

      - name: Build overlay input server
        shell: pwsh
        run: |
          cargo build --release --manifest-path GSM_Overlay/input_server/Cargo.toml
          New-Item -ItemType Directory -Force -Path GSM_Overlay/input_server/bin/win32 | Out-Null
          Copy-Item GSM_Overlay/input_server/target/release/gsm_overlay_server.exe GSM_Overlay/input_server/bin/win32/gsm_overlay_server.exe -Force

      - name: Normalize overlay template line endings
        shell: pwsh
        run: |
          Get-ChildItem -Path ./GSM_Overlay/yomitan/data/templates -Recurse -Include *.handlebars | ForEach-Object {
            $content = (Get-Content $_.FullName -Raw) -replace "`r`n", "`n"
            Set-Content $_.FullName $content -NoNewline
          }

      - name: Build overlay
        working-directory: GSM_Overlay
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npm run package

      - name: Install Electron dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Test game provisioning transport
        run: npx vitest run electron-src/main/services/game_provisioning_command.test.ts electron-src/main/services/game_provisioning_inbox.test.ts --config vitest.config.ts

      - name: Build native package
        run: npm run build:native

      - name: Compile Electron app
        run: npm run build

      - name: Build Windows helpers
        run: npm run build:windows-helpers

      - name: Stage overlay for Electron
        run: npm run stage:overlay

      - name: Package Windows installer and unpacked app
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          & npx electron-builder --publish=never --win *>&1 | Tee-Object -FilePath electron-builder.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Write-Error "electron-builder failed with exit code $exitCode"
            exit $exitCode
          }

      - name: Upload packaging diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gsm-windows-diagnostics-${{ env.BUILD_SHA }}
          path: electron-builder.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify packaged overlay
        run: npm run verify:overlay-package

      - name: Package unpacked app
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -Raw -Path "./package.json" | ConvertFrom-Json).version
          if (-not $packageVersion) {
            throw "Unable to read version from package.json."
          }

          $zipPath = Join-Path (Resolve-Path "dist").Path "GameSentenceMiner-$packageVersion-win-unpacked.zip"
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath $zipPath
          if (-not (Test-Path $zipPath)) {
            throw "Failed to create unpacked Windows zip."
          }

      - name: Write build metadata
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -Raw -Path "./package.json" | ConvertFrom-Json).version
          $metadata = [ordered]@{
            repository = "${{ github.repository }}"
            commit = "${{ env.BUILD_SHA }}"
            ref = "${{ github.head_ref || github.ref_name }}"
            workflowRunId = "${{ github.run_id }}"
            packageVersion = $packageVersion
            builtAtUtc = (Get-Date).ToUniversalTime().ToString("o")
            signed = $false
          }
          $metadata | ConvertTo-Json | Set-Content -Path "build-info.json" -Encoding utf8

      - name: Upload deployable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gsm-windows-${{ env.BUILD_SHA }}
          path: |
            dist/GameSentenceMiner-Setup-*.exe
            dist/GameSentenceMiner-*-win-unpacked.zip
            dist/latest.yml
            dist/*.blockmap
            build-info.json
          if-no-files-found: error
          retention-days: 14
